name: Legion Control backend Kotlin + Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify Project Workflow Standard v1.0 source
        run: python3 workflow-standard/tools/check_standard.py workflow-standard
      - name: Verify Legion Control workflow integration
        run: python3 scripts/check_workflow_integration.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform and NDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify backend contract and permissions
        run: python3 scripts/check_backend.py
      - name: Check permanent release signing contract without private keys
        run: python3 scripts/check_release_signing.py
      - name: Verify Kotlin/Rust session and local report contract
        run: python3 scripts/check_session_backend.py
      - name: Verify persistent history, sensor discovery and CSV export contracts
        run: python3 scripts/check_persistent_history.py
      - name: Verify permission-free resource telemetry and thermal rate guards
        run: python3 scripts/check_resource_telemetry.py
      - name: Verify alpha.5 existing-screen diagnostic integration
        run: python3 scripts/check_diagnostics_integration.py
      - name: Verify alpha.6 thermal and battery trend wiring
        run: python3 scripts/check_thermal_battery_trends.py
      - name: Execute lossless SQLite diagnostic migration and integration checks
        run: python3 scripts/check_diagnostic_sqlite_migration.py
      - name: Verify extended diagnostics CSV on real SQLite
        run: python3 scripts/check_extended_diagnostics_csv.py
      - name: Verify public battery health integration and cycle semantics
        run: python3 scripts/check_battery_health_backend.py
      - name: Check lossless sensor SQLite v1/v2 to v3 migrations
        run: python3 scripts/check_sensor_sqlite_migration.py
      - name: Validate alpha.11 v1-v3 to v4 SQLite attempt history and thermal integration
        run: python3 scripts/check_alpha11_diagnostics.py
      - name: Execute alpha.12 SQLite queries and nonblocking diagnostics archive contract
        run: python3 scripts/check_alpha12_integration.py
      - name: Verify SQLite v1-v4 to v5 and bounded foreground battery test wiring
        run: python3 scripts/check_alpha13_timed_battery.py
      - name: Run pure Kotlin CSV and Russian plural regression tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Test and compile real Rust backend for Android
        run: bash scripts/build-native.sh
      - name: Build Kotlin Android APK with native Rust library
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Validate Kotlin APK contains both Rust JNI libraries
        run: python3 scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Reject unsigned release attempt when secrets are absent
        shell: bash
        run: |
          if gradle --no-daemon :app:assembleRelease > "$RUNNER_TEMP/unsigned-attempt.log" 2>&1; then
            echo "::error::Release task incorrectly succeeded without a signing key"
            exit 1
          fi
          if ! grep -Fq 'Release signing secrets missing' "$RUNNER_TEMP/unsigned-attempt.log"; then
            tail -n 40 "$RUNNER_TEMP/unsigned-attempt.log"
            exit 1
          fi
          echo "PASS: unsigned release build rejected"
      - name: Verify release signing with a disposable CI-only certificate
        shell: bash
        env:
          LEGION_RELEASE_STORE_FILE: ${{ runner.temp }}/legion-control-ci-only.p12
          LEGION_RELEASE_STORE_PASSWORD: temporary-ci-only-pass-not-for-distribution
          LEGION_RELEASE_KEY_ALIAS: ci-temporary-key
          LEGION_RELEASE_KEY_PASSWORD: temporary-ci-only-pass-not-for-distribution
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$LEGION_RELEASE_STORE_FILE" \
            -storepass "$LEGION_RELEASE_STORE_PASSWORD" -keypass "$LEGION_RELEASE_KEY_PASSWORD" \
            -alias "$LEGION_RELEASE_KEY_ALIAS" -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=CI-ONLY, O=Legion Control"
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          if python3 scripts/verify_release_apk.py \
              app/build/outputs/apk/release/app-release.apk \
              "$ANDROID_HOME/build-tools/36.0.0/apksigner" > "$RUNNER_TEMP/reject-untrusted.log" 2>&1; then
            echo "::error::Temporary CI certificate passed the pinned release fingerprint check"
            exit 1
          fi
          grep -Fq 'MISMATCH' "$RUNNER_TEMP/reject-untrusted.log"
          rm -f "$LEGION_RELEASE_STORE_FILE"
          echo "PASS: disposable release certificate works and is rejected for distribution"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Legion-Control-v0.1.0-alpha.13-kotlin-rust-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
