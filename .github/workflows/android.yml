name: Legion Control backend Kotlin + Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify Project Workflow Standard v1.0 source
        run: python3 workflow-standard/tools/check_standard.py workflow-standard
      - name: Verify Legion Control workflow integration
        run: python3 scripts/check_workflow_integration.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform and NDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify backend contract and permissions
        run: python3 scripts/check_backend.py
      - name: Check permanent release signing contract without private keys
        run: python3 scripts/check_release_signing.py
      - name: Verify Kotlin/Rust session and local report contract
        run: python3 scripts/check_session_backend.py
      - name: Verify persistent history, sensor discovery and CSV export contracts
        run: python3 scripts/check_persistent_history.py
      - name: Verify permission-free resource telemetry and thermal rate guards
        run: python3 scripts/check_resource_telemetry.py
      - name: Verify alpha.5 existing-screen diagnostic integration
        run: python3 scripts/check_diagnostics_integration.py
      - name: Verify alpha.6 thermal and battery trend wiring
        run: python3 scripts/check_thermal_battery_trends.py
      - name: Execute lossless SQLite diagnostic migration and integration checks
        run: python3 scripts/check_diagnostic_sqlite_migration.py
      - name: Verify extended diagnostics CSV on real SQLite
        run: python3 scripts/check_extended_diagnostics_csv.py
      - name: Verify public battery health integration and cycle semantics
        run: python3 scripts/check_battery_health_backend.py
      - name: Check lossless sensor SQLite v1/v2 to v3 migrations
        run: python3 scripts/check_sensor_sqlite_migration.py
      - name: Validate alpha.11 v1-v3 to v4 SQLite attempt history and thermal integration
        run: python3 scripts/check_alpha11_diagnostics.py
      - name: Execute alpha.12 SQLite queries and nonblocking diagnostics archive contract
        run: python3 scripts/check_alpha12_integration.py
      - name: Verify SQLite v1-v4 to v5 and bounded foreground battery test wiring
        run: python3 scripts/check_alpha13_timed_battery.py
      - name: Validate alpha.14 ten gaming diagnostics and exact permission allowlist
        run: python3 scripts/check_alpha14_gaming.py
      - name: Verify alpha.15 Hardware Lab backend and unchanged permissions
        run: python3 scripts/check_alpha15_hardware.py
      - name: Validate alpha.16 Compatibility Lab and safety invariants
        run: python3 scripts/check_alpha16_compatibility.py
      - name: Verify alpha.17 universal sessions and real SQLite v5-to-v6 migration
        run: python3 scripts/check_alpha17_sessions.py
      - name: Verify alpha.18 smart profiles and real SQLite v6-to-v7 migration
        run: python3 scripts/check_alpha18_smart_profiles.py
      - name: Verify alpha.19 Experiment Lab and real SQLite v7-to-v8 migration
        run: python3 scripts/check_alpha19_experiments.py
      - name: Verify alpha.20 Connectivity Observatory and real SQLite v8-to-v9 migration
        run: python3 scripts/check_alpha20_connectivity.py
      - name: Verify alpha.21 Application Center and real SQLite v9-to-v10 migration
        run: python3 scripts/check_alpha21_application_center.py
      - name: Verify alpha.22 Audio Lab and real SQLite v10-to-v11 migration
        run: python3 scripts/check_alpha22_audio_lab.py
      - name: Verify alpha.23 Haptic Lab and real SQLite v11-to-v12 migration
        run: python3 scripts/check_alpha23_haptic_lab.py
      - name: Verify alpha.24 Game Toolbox permission, lifecycle and actions
        run: python3 scripts/check_alpha24_game_toolbox.py
      - name: Verify alpha.25 MediaProjection Capture Studio and owned MP4 lifecycle
        run: python3 scripts/check_alpha25_capture_studio.py
      - name: Verify alpha.26 MVVM navigation and preserved Kotlin/Rust backend
        run: python3 scripts/check_alpha26_mvvm_navigation.py
      - name: Verify alpha.27 MVVM diagnostic + capture refactor and preserved Rust backend
        run: python3 scripts/check_alpha27_mvvm_backend.py
      - name: Verify alpha.28 real ViewModel backends and foreground safety
        run: python3 scripts/check_alpha28_mvvm_backends.py
      - name: Verify alpha.29 central Navigation Component routes
        run: python3 scripts/check_alpha29_navigation_routes.py
      - name: Validate alpha.30 in-session marks, event correlations and safe CSV
        run: python3 scripts/check_alpha30_session_signals.py
      - name: Validate alpha.31 per-game baseline backend and navigation
        run: python3 scripts/check_alpha31_session_baselines.py
      - name: Validate alpha.32 session incident engine and routes
        run: python3 scripts/check_alpha32_session_incidents.py
      - name: Check alpha.33 user-triggered game launch profile backend and undo
        run: python3 scripts/check_alpha33_game_launch_profiles.py
      - name: Validate alpha.34 consented screenshot service and owned PNG library
        run: python3 scripts/check_alpha34_screenshots.py
      - name: Validate alpha.35 MediaRecorder pause/resume state and time accounting
        run: python3 scripts/check_alpha35_capture_pause_resume.py
      - name: Validate alpha.36 game playback audio capture and no-microphone media muxing
        run: python3 scripts/check_alpha36_playback_audio.py
      - name: Validate alpha.37 bounded non-destructive Clip Workshop exports
        run: python3 scripts/check_alpha37_clip_workshop.py
      - name: Validate alpha.38 per-game Capture Studio profiles and atomic SAF backups
        run: python3 scripts/check_alpha38_game_capture_profiles.py
      - name: Validate alpha.39 consented rolling H264 Replay and export
        run: python3 scripts/check_alpha39_replay.py
      - name: Verify alpha.40 audit remediation, permission isolation and data safety
        run: python3 scripts/check_alpha40_audit_remediation.py
      - name: Verify alpha.41 Replay timestamp safety
        run: python3 scripts/check_alpha41_replay_timestamps.py
      - name: Validate alpha.42 Game Toolbox unified UI routing and permissions
        run: python3 scripts/check_alpha42_toolbox_ui.py
      - name: Verify consistent AMOLED module frontend and legacy navigation
        run: python3 scripts/check_unified_amoled_frontend.py
      - name: Run pure Kotlin CSV and Russian plural regression tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Test and compile real Rust backend for Android
        run: bash scripts/build-native.sh
      - name: Build Kotlin Android APK with native Rust library
        run: gradle --no-daemon assembleDebug lintDebug assembleDebugAndroidTest
      - name: Validate Kotlin APK contains both Rust JNI libraries
        run: python3 scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Reject unsigned release attempt when secrets are absent
        shell: bash
        run: |
          if gradle --no-daemon :app:assembleRelease > "$RUNNER_TEMP/unsigned-attempt.log" 2>&1; then
            echo "::error::Release task incorrectly succeeded without a signing key"
            exit 1
          fi
          if ! grep -Fq 'Release signing secrets missing' "$RUNNER_TEMP/unsigned-attempt.log"; then
            tail -n 40 "$RUNNER_TEMP/unsigned-attempt.log"
            exit 1
          fi
          echo "PASS: unsigned release build rejected"
      - name: Verify release signing with a disposable CI-only certificate
        shell: bash
        env:
          LEGION_RELEASE_STORE_FILE: ${{ runner.temp }}/legion-control-ci-only.p12
          LEGION_RELEASE_STORE_PASSWORD: temporary-ci-only-pass-not-for-distribution
          LEGION_RELEASE_KEY_ALIAS: ci-temporary-key
          LEGION_RELEASE_KEY_PASSWORD: temporary-ci-only-pass-not-for-distribution
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$LEGION_RELEASE_STORE_FILE" \
            -storepass "$LEGION_RELEASE_STORE_PASSWORD" -keypass "$LEGION_RELEASE_KEY_PASSWORD" \
            -alias "$LEGION_RELEASE_KEY_ALIAS" -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=CI-ONLY, O=Legion Control"
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          if python3 scripts/verify_release_apk.py \
              app/build/outputs/apk/release/app-release.apk \
              "$ANDROID_HOME/build-tools/36.0.0/apksigner" > "$RUNNER_TEMP/reject-untrusted.log" 2>&1; then
            echo "::error::Temporary CI certificate passed the pinned release fingerprint check"
            exit 1
          fi
          grep -Fq 'MISMATCH' "$RUNNER_TEMP/reject-untrusted.log"
          rm -f "$LEGION_RELEASE_STORE_FILE"
          echo "PASS: disposable release certificate works and is rejected for distribution"
      - name: Stage both APKs at a flat artifact root
        run: |
          mkdir -p ci-apks
          cp app/build/outputs/apk/debug/app-debug.apk ci-apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ci-apks/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Legion-Control-v0.1.0-alpha.43-kotlin-rust-debug
          path: ci-apks/*.apk
          if-no-files-found: error

  emulator-smoke:
    name: Android 35 x86_64 emulator UI + user-triggered session smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve APK from exact Kotlin/Rust build
        uses: actions/download-artifact@v4
        with:
          name: Legion-Control-v0.1.0-alpha.43-kotlin-rust-debug
          path: smoke-apk
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and launch on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/check_android_emulator_smoke.py smoke-apk/app-debug.apk
      - name: Attach emulator screenshots and diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Legion-Control-alpha29-android35-ui-smoke
          path: smoke-evidence/
          if-no-files-found: warn
