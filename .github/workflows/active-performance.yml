name: Beta 1 active workload profiling
on:
  pull_request:
    paths:
      - 'scripts/measure_active_workloads.py'
      - '.github/workflows/active-performance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  active-workloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact baseline successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/"$GITHUB_REPOSITORY"/actions/runs/45405804990 | jq -e '.head_sha == "a02654b523e4428a03c823518e7f3beb1c41fb63" and .conclusion == "success"'
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/14925518313 | jq -e '.expired == false and .workflow_run.id == 45405804990'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Legion-Control-v0.1.0-beta.1-kotlin-rust-debug
          run-id: 45405804990
          github-token: ${{ github.token }}
          path: workload-apk
      - run: sudo chmod 666 /dev/kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/measure_active_workloads.py workload-apk/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: beta1-active-workload-evidence
          path: smoke-evidence/
          if-no-files-found: warn
