name: Legion Control permanently signed APK

on:
  # Only trusted main-branch changes can access protected signing secrets.
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'rust-core/**'
      - 'scripts/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify signing secrets are configured
        env:
          LEGION_RELEASE_KEYSTORE_B64: ${{ secrets.LEGION_RELEASE_KEYSTORE_B64 }}
          LEGION_RELEASE_STORE_PASSWORD: ${{ secrets.LEGION_RELEASE_STORE_PASSWORD }}
          LEGION_RELEASE_KEY_ALIAS: ${{ secrets.LEGION_RELEASE_KEY_ALIAS }}
          LEGION_RELEASE_KEY_PASSWORD: ${{ secrets.LEGION_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          for variable in LEGION_RELEASE_KEYSTORE_B64 LEGION_RELEASE_STORE_PASSWORD LEGION_RELEASE_KEY_ALIAS LEGION_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing required signing secret: $variable"
              exit 1
            fi
          done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK platform and NDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'
      - name: Run shared source and SQLite checks
        run: python3 scripts/run_source_checks.py
      - name: Test local CSV and Russian plural formatting before release
        run: gradle --no-daemon testDebugUnitTest
      - name: Test and build real Rust native libraries
        run: bash scripts/build-native.sh
      - name: Generate resolved Android and Rust runtime SBOMs
        run: |
          gradle --no-daemon -I scripts/dependency_inventory.init.gradle :app:writeRuntimeDependencyInventory
          python3 scripts/generate_runtime_sbom.py --revision "$(git rev-parse HEAD)" --output runtime-sbom
      - name: Attach resolved runtime dependency inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Legion-Control-runtime-sbom
          path: |
            runtime-sbom/*.cdx.json
            app/build/reports/dependency-inventory/android-runtime.json
          if-no-files-found: error
      - name: Check resolved runtime dependencies against OSV
        run: python3 scripts/scan_runtime_osv.py --sbom-dir runtime-sbom --output runtime-sbom/osv-report.json
      - name: Attach OSV scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Legion-Control-runtime-osv
          path: runtime-sbom/osv-report.json
          if-no-files-found: ignore
      - name: Restore private release keystore outside the repository
        env:
          LEGION_RELEASE_KEYSTORE_B64: ${{ secrets.LEGION_RELEASE_KEYSTORE_B64 }}
          LEGION_RELEASE_STORE_FILE: ${{ runner.temp }}/legion-control-release.p12
        shell: bash
        run: |
          umask 077
          printf '%s' "$LEGION_RELEASE_KEYSTORE_B64" | base64 --decode > "$LEGION_RELEASE_STORE_FILE"
          test -s "$LEGION_RELEASE_STORE_FILE"
      - name: Build with the permanent release certificate
        env:
          LEGION_RELEASE_STORE_FILE: ${{ runner.temp }}/legion-control-release.p12
          LEGION_RELEASE_STORE_PASSWORD: ${{ secrets.LEGION_RELEASE_STORE_PASSWORD }}
          LEGION_RELEASE_KEY_ALIAS: ${{ secrets.LEGION_RELEASE_KEY_ALIAS }}
          LEGION_RELEASE_KEY_PASSWORD: ${{ secrets.LEGION_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify APK, native Rust libraries and permanent signing certificate
        shell: bash
        run: |
          python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify_release_apk.py app/build/outputs/apk/release/app-release.apk "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Legion-Control-v0.1.0-beta.1-permanent-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Wait for exact main commit Android CI before publication
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in $(seq 1 120); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml \
              --event push --branch main --commit "$GITHUB_SHA" --limit 10 --json headSha,headBranch,event,status,conclusion)
            if jq -e --arg sha "$GITHUB_SHA" \
                 '[.[] | select(.headSha == $sha and .headBranch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")] | length > 0' \
                 <<< "$result" >/dev/null; then
              verified=1
              break
            fi
            if jq -e --arg sha "$GITHUB_SHA" \
                 '[.[] | select(.headSha == $sha and .headBranch == "main" and .event == "push" and .status == "completed" and .conclusion == "failure")] | length > 0' \
                 <<< "$result" >/dev/null; then
              echo '::error::Android CI failed for signed commit; refusing to publish'
              exit 1
            fi
            sleep 10
          done
          if [ "$verified" -ne 1 ]; then
            echo '::error::Exact-commit emulator CI did not finish successfully'
            exit 1
          fi
      - name: Publish pre-release with permanent certificate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.1.0-beta.1
          apk=app/build/outputs/apk/release/app-release.apk
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to replace binaries"
            exit 1
          fi
          test -s "$apk"
          asset=Legion-Control-v0.1.0-beta.1-signed.apk
          cp "$apk" "$asset"
          gh release create "$tag" "$asset" runtime-sbom/releaseRuntimeClasspath.cdx.json --repo "$GITHUB_REPOSITORY" \
            --title 'Legion Control v0.1.0-beta.1' \
            --notes-file docs/BETA1-RELEASE-NOTES.md \
            --prerelease --target "$GITHUB_SHA"

      - name: Remove temporary permanent signing keystore
        if: always()
        env:
          LEGION_RELEASE_STORE_FILE: ${{ runner.temp }}/legion-control-release.p12
        shell: bash
        run: rm -f -- "$LEGION_RELEASE_STORE_FILE"
