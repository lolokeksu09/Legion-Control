name: Legion Control permanently signed APK

on:
  # Only trusted main-branch changes can access protected signing secrets.
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'rust-core/**'
      - 'scripts/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify signing secrets are configured
        env:
          LEGION_RELEASE_KEYSTORE_B64: ${{ secrets.LEGION_RELEASE_KEYSTORE_B64 }}
          LEGION_RELEASE_STORE_PASSWORD: ${{ secrets.LEGION_RELEASE_STORE_PASSWORD }}
          LEGION_RELEASE_KEY_ALIAS: ${{ secrets.LEGION_RELEASE_KEY_ALIAS }}
          LEGION_RELEASE_KEY_PASSWORD: ${{ secrets.LEGION_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          for variable in LEGION_RELEASE_KEYSTORE_B64 LEGION_RELEASE_STORE_PASSWORD LEGION_RELEASE_KEY_ALIAS LEGION_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing required signing secret: $variable"
              exit 1
            fi
          done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK platform and NDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'
      - name: Verify source contract
        run: |
          python3 scripts/check_backend.py
          python3 scripts/check_release_signing.py
          python3 scripts/check_session_backend.py
          python3 scripts/check_persistent_history.py
          python3 scripts/check_resource_telemetry.py
          python3 scripts/check_diagnostics_integration.py
          python3 scripts/check_thermal_battery_trends.py
          python3 scripts/check_diagnostic_sqlite_migration.py
          python3 scripts/check_extended_diagnostics_csv.py
          python3 scripts/check_battery_health_backend.py
          python3 scripts/check_sensor_sqlite_migration.py
          python3 scripts/check_alpha11_diagnostics.py
          python3 scripts/check_alpha12_integration.py
          python3 scripts/check_alpha13_timed_battery.py
          python3 scripts/check_alpha14_gaming.py
          python3 scripts/check_alpha15_hardware.py
          python3 scripts/check_alpha16_compatibility.py
          python3 scripts/check_alpha17_sessions.py
          python3 scripts/check_alpha18_smart_profiles.py
          python3 scripts/check_alpha19_experiments.py
          python3 scripts/check_alpha20_connectivity.py
          python3 scripts/check_alpha21_application_center.py
          python3 scripts/check_alpha22_audio_lab.py
          python3 scripts/check_alpha23_haptic_lab.py
          python3 scripts/check_alpha24_game_toolbox.py
          python3 scripts/check_alpha25_capture_studio.py
          python3 scripts/check_alpha26_mvvm_navigation.py
          python3 scripts/check_alpha27_mvvm_backend.py
          python3 scripts/check_alpha38_game_capture_profiles.py
          python3 scripts/check_alpha39_replay.py
          python3 scripts/check_alpha40_audit_remediation.py
          python3 scripts/check_alpha41_replay_timestamps.py
          python3 scripts/check_feature_finder.py
          python3 scripts/check_live_monitor.py
          python3 scripts/check_game_preflight.py
          python3 scripts/check_session_compare.py
          python3 scripts/check_session_library.py
      - name: Verify alpha.44 legacy route and module design parity
        run: python3 scripts/check_alpha44_module_ui.py
      - name: Validate alpha.42 Game Toolbox unified UI routing and permissions
        run: python3 scripts/check_alpha42_toolbox_ui.py
      - name: Test local CSV and Russian plural formatting before release
        run: gradle --no-daemon testDebugUnitTest
      - name: Test and build real Rust native libraries
        run: bash scripts/build-native.sh
      - name: Restore private release keystore outside the repository
        env:
          LEGION_RELEASE_KEYSTORE_B64: ${{ secrets.LEGION_RELEASE_KEYSTORE_B64 }}
          LEGION_RELEASE_STORE_FILE: ${{ runner.temp }}/legion-control-release.p12
        shell: bash
        run: |
          umask 077
          printf '%s' "$LEGION_RELEASE_KEYSTORE_B64" | base64 --decode > "$LEGION_RELEASE_STORE_FILE"
          test -s "$LEGION_RELEASE_STORE_FILE"
      - name: Build with the permanent release certificate
        env:
          LEGION_RELEASE_STORE_FILE: ${{ runner.temp }}/legion-control-release.p12
          LEGION_RELEASE_STORE_PASSWORD: ${{ secrets.LEGION_RELEASE_STORE_PASSWORD }}
          LEGION_RELEASE_KEY_ALIAS: ${{ secrets.LEGION_RELEASE_KEY_ALIAS }}
          LEGION_RELEASE_KEY_PASSWORD: ${{ secrets.LEGION_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify APK, native Rust libraries and permanent signing certificate
        shell: bash
        run: |
          python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify_release_apk.py app/build/outputs/apk/release/app-release.apk "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Legion-Control-v0.1.0-alpha.48-permanent-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Wait for exact main commit Android CI before publication
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in $(seq 1 120); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml \
              --commit "$GITHUB_SHA" --limit 10 --json headSha,status,conclusion)
            if jq -e --arg sha "$GITHUB_SHA" \
                 '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | length > 0' \
                 <<< "$result" >/dev/null; then
              verified=1
              break
            fi
            if jq -e --arg sha "$GITHUB_SHA" \
                 '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "failure")] | length > 0' \
                 <<< "$result" >/dev/null; then
              echo '::error::Android CI failed for signed commit; refusing to publish'
              exit 1
            fi
            sleep 10
          done
          if [ "$verified" -ne 1 ]; then
            echo '::error::Exact-commit emulator CI did not finish successfully'
            exit 1
          fi
      - name: Publish pre-release with permanent certificate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.1.0-alpha.48
          apk=app/build/outputs/apk/release/app-release.apk
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists; refusing to replace binaries"
            exit 0
          fi
          test -s "$apk"
          asset=Legion-Control-v0.1.0-alpha.48-signed.apk
          cp "$apk" "$asset"
          gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" \
            --title 'Legion Control v0.1.0-alpha.48' \
            --notes-file docs/ALPHA48-RELEASE-NOTES.md \
            --prerelease --target "$GITHUB_SHA"

      - name: Remove temporary permanent signing keystore
        if: always()
        env:
          LEGION_RELEASE_STORE_FILE: ${{ runner.temp }}/legion-control-release.p12
        shell: bash
        run: rm -f -- "$LEGION_RELEASE_STORE_FILE"
