import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// Read resolved runtime coordinates; no new Gradle plugin or dependency.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('writeRuntimeDependencyInventory') {
        def output = app.layout.buildDirectory.file('reports/dependency-inventory/android-runtime.json')
        outputs.file(output)
        outputs.upToDateWhen { false }
        doLast {
            def result = [:]
            ['debugRuntimeClasspath', 'releaseRuntimeClasspath'].each { name ->
                def resolution = app.configurations.getByName(name).incoming.resolutionResult
                def failures = resolution.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
                if (!failures.isEmpty()) throw new GradleException("Unresolved runtime dependencies in " + name)
                result[name] = resolution.allComponents.collect { it.id }
                    .findAll { it instanceof ModuleComponentIdentifier }
                    .collect { [group: it.group, name: it.module, version: it.version] }
                    .unique().sort { a, b -> [a.group,a.name,a.version] <=> [b.group,b.name,b.version] }
            }
            def file = output.get().asFile
            file.parentFile.mkdirs()
            file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(result)) + '\n', 'UTF-8')
        }
    }
}
